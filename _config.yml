# Site settings for Junteng Liu's homepage (Academic Pages template)
locale: "en-US"
title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: "Homepage of Junteng Liu, Ph.D. candidate at HKUST NLP Group."
url: https://bondmythspell.github.io
baseurl: "/LJT-Homepage"
repository: "BondMythSpell/LJT-Homepage"

author:
  avatar: "profile.png"
  name: "Junteng Liu"
  bio: "First-year Ph.D. candidate at HKUST NLP Group."
  employer: "Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

future: true
read_more: "disabled"
talkmap_link: false

og_image: og-image.png
twitter:
  username: "junteng88716710"

analytics:
  provider: "false"

include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

kramdown:
  input: GFM

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: {path: "", type: posts}
    values: {layout: single, author_profile: true}
  - scope: {path: "", type: pages}
    values: {layout: single, author_profile: true}
  - scope: {path: "", type: teaching}
    values: {layout: single, author_profile: true}
  - scope: {path: "", type: publications}
    values: {layout: single, author_profile: true}
  - scope: {path: "", type: portfolio}
    values: {layout: single, author_profile: true}
  - scope: {path: "", type: talks}
    values: {layout: talk, author_profile: true}

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
